<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScaleX – Insights & Blogs</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="shortcut icon" href="logo1.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">
      <img src="logo1.png" alt="ScaleX Logo" class="logo-icon" />
      <span class="logo-text">ScaleX</span>
    </div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#" class="active">Blogs</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
    <button class="btn-get-started">Get Started <i class="ri-arrow-right-up-line"></i></button>
  </nav>

  <section class="hero">
    <h1 class="hero-title">Insights &amp; Blogs</h1>
  </section>

  <div class="filters">
    <button class="filter-btn active"><i class="ri-apps-2-line"></i> All</button>
    <button class="filter-btn"><i class="ri-cpu-line"></i> Tech</button>
    <button class="filter-btn"><i class="ri-cloud-line"></i> SaaS</button>
    <button class="filter-btn"><i class="ri-bar-chart-box-line"></i> Marketing</button>

  <section class="cards-grid">

    <article class="card">
      <div class="card-image">
        <img src="https://media.istockphoto.com/id/108226836/photo/martini-splashing-on-red-background.jpg?s=612x612&w=0&k=20&c=juq1H2TbcdOto2c_DSPFBI0B8I0BBBzcsYlGh5tzGl0=" alt="mocktail image" />
      </div>
      <div class="card-body">
        <span class="tag tag--tech">Tech</span>
        <h2 class="card-title">The Ultimate Guide To SaaS Marketing</h2>
        <p class="card-date"><i class="ri-calendar-line"></i> May 23, 2025</p>
      </div>
    </article>

    <article class="card">
      <div class="card-image">
        <img src="https://assets.lummi.ai/assets/QmaLJLztpwec5dhRriuXGij4xsiR4EvtPiLvKMi7b2u7qe?auto=format&w=640" alt="Chair image" />
      </div>
      <div class="card-body">
        <span class="tag tag--saas">SaaS</span>
        <h2 class="card-title">5 Key Trends In SaaS Growth For 2025</h2>
        <p class="card-date"><i class="ri-calendar-line"></i> May 23, 2025</p>
      </div>
    </article>

    <article class="card">
      <div class="card-image">
        <img src="https://i.pinimg.com/736x/ad/09/0a/ad090a958b6313f80afc811f166ac307.jpg" alt="Catimage" />
      </div>
      <div class="card-body">
        <span class="tag tag--marketing">Marketing</span>
        <h2 class="card-title">How Data-Driven Strategies Are Important</h2>
        <p class="card-date"><i class="ri-calendar-line"></i> May 23, 2025</p>
      </div>
    </article>

  </section>

</html>
